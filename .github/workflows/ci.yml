name: CI/CD

on:
  # Test untrusted PR code without the privileged pull_request_target context.
  pull_request: {}
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet test --configuration Release
      - name: Package Lambda
        run: dotnet lambda package
        working-directory: src/HelloWorld
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
      - run: sam validate --lint --template-file serverless.yml --region us-east-1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: lambda-package
          path: src/HelloWorld/bin/Release/net10.0/HelloWorld.zip
          if-no-files-found: error

  deploy:
    name: Deploy to AWS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'aidansteele/demo-serverless-aspnetcore'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Non-secret outputs of the separate deployment bootstrap stack.
      AWS_ROLE_ARN: arn:aws:iam::887559014507:role/demo-serverless-aspnetcore-github
      AWS_REGION: us-east-1
      CFN_EXECUTION_ROLE_ARN: arn:aws:iam::887559014507:role/demo-serverless-aspnetcore-cloudformation
    permissions:
      contents: read
      id-token: write # Mint a short-lived OIDC token for the AWS deployment role.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-package
          path: src/HelloWorld/bin/Release/net10.0
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
      - name: Assume deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '887559014507'
      - name: Deploy
        run: >-
          sam deploy --template-file serverless.yml
          --stack-name hello-world-app --resolve-s3 --s3-prefix hello-world-app
          --role-arn "$CFN_EXECUTION_ROLE_ARN" --capabilities CAPABILITY_IAM
          --no-confirm-changeset --no-fail-on-empty-changeset
